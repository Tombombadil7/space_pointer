name: PlatformIO

on:
  push:
    branches: [main, "fix/**", "review/**"]
  pull_request:
    branches: [main]

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Run native unit tests
        run: pio test -e native

  esp32-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build ESP32-S3 firmware
        run: pio run -e esp32-s3-devkitc-1

  web-ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test dashboard request and telemetry behavior
        run: node --test test/test_web_ui.js
